name: Nuclear CI

# Builds the Windows (and, outside pull requests, the macOS) app on every push to main and every pull request, and keeps the .exe files
# as a downloadable artifact, so the app can be tried without installing Rust.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuclear-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build desktop app and CLI
        run: cargo build --release -p solidcraft -p solidcraft-cli
      - name: Collect the executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/solidcraft.exe dist/nuclear.exe
          Copy-Item target/release/solidcraft-cli.exe dist/nuclear-cli.exe
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE, ATTRIBUTION.md, THIRD-PARTY-LICENSES.txt dist/
      - uses: actions/upload-artifact@v4
        with:
          name: nuclear-windows-x64
          path: dist/

  tests:
    name: UI and app tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      # The same runner and profiles as upstream SolidCraft's CI: the `ci` cargo profile (debug
      # assertions off; egui's debug-only checks fail headless UI tests) and nextest's `ci` profile
      # (each test in its own process, heavy tests skipped). Timing tests such as the first-hover
      # check assume that isolation.
      - name: Test
        run: cargo nextest run --cargo-profile ci --profile ci --locked --no-tests=pass --lib --bins -p solidcraft-ui-egui -p solidcraft-io -p solidcraft -p solidcraft-cli

  # macOS: each half of the universal binary builds on its own Intel runner (aarch64 is a cross
  # build; GitHub's Apple-silicon runners are short of capacity and macos-14 is being retired), then `macos` joins them into one Nuclear.app. The app is ad-hoc signed, not
  # notarized: the first launch needs right-click > Open (or `xattr -dr com.apple.quarantine`).
  # Skipped on pull requests to keep macOS minutes for real builds; run it with workflow_dispatch.
  macos-build:
    name: macOS build ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    runs-on: macos-15-intel
    timeout-minutes: 120
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.target }}
      - name: Build desktop app and CLI
        run: cargo build --release --locked -p solidcraft -p solidcraft-cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-bin-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/solidcraft
            target/${{ matrix.target }}/release/solidcraft-cli
          retention-days: 1

  macos:
    name: macOS universal app
    needs: macos-build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-bin-aarch64-apple-darwin
          path: bin/arm64
      - uses: actions/download-artifact@v4
        with:
          name: macos-bin-x86_64-apple-darwin
          path: bin/x86_64
      - name: Assemble Nuclear.app
        run: |
          set -euo pipefail
          VERSION="$(awk '/^\[/{p=($0=="[workspace.package]");next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)"
          SHORT_VERSION="${VERSION%%-*}"
          APP=dist/Nuclear.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/Licenses" work
          # Drop the linker's ad-hoc signatures from the halves; the joined binaries are signed below.
          chmod u+w bin/*/*
          for f in bin/*/*; do codesign --remove-signature "$f" || true; done
          lipo -create -output "$APP/Contents/MacOS/Nuclear" bin/arm64/solidcraft bin/x86_64/solidcraft
          # The app starts the agent's MCP server from solidcraft-cli beside the running program.
          lipo -create -output "$APP/Contents/MacOS/solidcraft-cli" bin/arm64/solidcraft-cli bin/x86_64/solidcraft-cli
          chmod +x "$APP/Contents/MacOS/"*
          lipo -info "$APP/Contents/MacOS/Nuclear"
          # The Nuclear icon, drawn from the largest exported PNG.
          SRC=assets/icons/app/linux/exports/hicolor/512x512/apps/io.tangencylabs.solidcraft.png
          ICONSET=work/Nuclear.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s "$SRC" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2)); [ $d -gt 512 ] && d=512
            sips -z $d $d "$SRC" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/Nuclear.icns"
          # Upstream's Info.plist with the visible names and the icon switched to Nuclear; the
          # bundle id and file types stay, so settings and designs are shared with older builds.
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHORT_VERSION@/$SHORT_VERSION/g" \
              -e 's#<string>SolidCraft</string>#<string>Nuclear</string>#g' \
              -e 's#<string>SolidCraft design</string>#<string>Nuclear design</string>#g' \
              assets/platforms/macos/Info.plist.in >"$APP/Contents/Info.plist"
          # No Assets.car: Finder takes the icon from CFBundleIconFile.
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleIconName' "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          printf 'APPL????' >"$APP/Contents/PkgInfo"
          for f in README.md LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md THIRD-PARTY-LICENSES.txt; do
            [ -f "$f" ] && cp "$f" "$APP/Contents/Resources/Licenses/"
          done
          # Ad-hoc signature: Apple silicon refuses unsigned code. Nested code first.
          codesign --force --sign - --timestamp=none --identifier io.tangencylabs.solidcraft.cli "$APP/Contents/MacOS/solidcraft-cli"
          codesign --force --sign - --timestamp=none --entitlements packaging/macos/entitlements.plist "$APP"
          codesign --verify --strict --deep --verbose=2 "$APP"
          "$APP/Contents/MacOS/Nuclear" --version
          "$APP/Contents/MacOS/solidcraft-cli" --version
          echo "VERSION=$VERSION" >>"$GITHUB_ENV"
      - name: Package (dmg and zip)
        run: |
          set -euo pipefail
          mkdir -p out work/dmg
          cp -R dist/Nuclear.app work/dmg/
          ln -s /Applications work/dmg/Applications
          cp LICENSE-MIT LICENSE-APACHE NOTICE work/dmg/
          hdiutil create -volname Nuclear -srcfolder work/dmg -ov -format UDZO "out/Nuclear-$VERSION-macos-universal.dmg"
          ditto -c -k --keepParent dist/Nuclear.app "out/Nuclear-$VERSION-macos-universal.zip"
          # Check the image as a user gets it.
          MNT="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "out/Nuclear-$VERSION-macos-universal.dmg"
          codesign --verify --deep --verbose=2 "$MNT/Nuclear.app"
          "$MNT/Nuclear.app/Contents/MacOS/Nuclear" --version
          hdiutil detach "$MNT"
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: nuclear-macos-universal
          path: out/

  # Mac proof without a Mac: install the packaged app the way a user would (from the dmg, with the
  # quarantine flag a download gets, then removed as the instructions say), launch it with the
  # sample design and drive it over the control channel: window screenshot, GPU render, quit.
  macos-smoke:
    name: macOS launch test (${{ matrix.runner }})
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    # The Apple-silicon run may wait long for a runner; the Intel run is the gate.
    continue-on-error: ${{ matrix.runner == 'macos-15' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nuclear-macos-universal
          path: pkg
      - name: Install from the dmg
        run: |
          set -euo pipefail
          DMG="$(ls pkg/*.dmg)"
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$DMG"
          MNT="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$MNT" "$DMG"
          mkdir -p "$HOME/Applications"
          cp -R "$MNT/Nuclear.app" "$HOME/Applications/"
          hdiutil detach "$MNT"
          xattr -dr com.apple.quarantine "$HOME/Applications/Nuclear.app"
          codesign --verify --deep --strict --verbose=2 "$HOME/Applications/Nuclear.app"
          sw_vers; uname -m
          system_profiler SPDisplaysDataType || true
      - name: Launch and drive the app
        run: python3 packaging/macos/smoke-test.py "$HOME/Applications/Nuclear.app" smoke
      - name: Desktop screenshot
        if: always()
        run: |
          mkdir -p smoke
          screencapture -x smoke/desktop.png || true
      - name: Print the pictures (base64 JPEG, for reviewers without artifact access)
        if: always()
        run: |
          for f in smoke/*.png; do
            [ -s "$f" ] || continue
            sips -s format jpeg -s formatOptions 70 -Z 1400 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "==BEGIN $(basename "${f%.png}.jpg")=="
            base64 -b 76 -i "${f%.png}.jpg"
            echo "==END=="
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuclear-macos-smoke-${{ matrix.runner }}
          path: smoke/

  # The app and UI test suite on macOS, as the Linux `tests` job runs it.
  macos-tests:
    name: UI and app tests (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-tests
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - name: Test
        run: cargo nextest run --cargo-profile ci --profile ci --locked --no-tests=pass --lib --bins -p solidcraft-ui-egui -p solidcraft-io -p solidcraft -p solidcraft-cli
