name: Nuclear CI

# Builds the Windows app on every push to main and every pull request, and keeps the .exe files
# as a downloadable artifact, so the app can be tried without installing Rust.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuclear-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build desktop app and CLI
        run: cargo build --release -p solidcraft -p solidcraft-cli
      - name: Collect the executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/solidcraft.exe dist/nuclear.exe
          Copy-Item target/release/solidcraft-cli.exe dist/nuclear-cli.exe
          Copy-Item LICENSE-MIT, LICENSE-APACHE, NOTICE, ATTRIBUTION.md, THIRD-PARTY-LICENSES.txt dist/
      - uses: actions/upload-artifact@v4
        with:
          name: nuclear-windows-x64
          path: dist/

  tests:
    name: UI and app tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      # The same runner and profiles as upstream SolidCraft's CI: the `ci` cargo profile (debug
      # assertions off; egui's debug-only checks fail headless UI tests) and nextest's `ci` profile
      # (each test in its own process, heavy tests skipped). Timing tests such as the first-hover
      # check assume that isolation.
      - name: Test
        run: cargo nextest run --cargo-profile ci --profile ci --locked --no-tests=pass --lib --bins -p solidcraft-ui-egui -p solidcraft-io -p solidcraft -p solidcraft-cli
